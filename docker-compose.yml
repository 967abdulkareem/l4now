# Local preview of exactly what gets deployed:
#   docker compose up --build   →   http://localhost:8080
services:
  site:
    build:
      context: .
      args:
        # Leave empty for localhost. Set to /<repo-name> to mirror a GitHub
        # Pages project site.
        NEXT_PUBLIC_BASE_PATH: ""
    ports:
      - "8080:80"
    restart: unless-stopped
